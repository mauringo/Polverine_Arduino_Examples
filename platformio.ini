[platformio]
default_envs = polverine-full
; Published builds must not silently select editable libraries under lib/.
lib_dir = .pio/project-libs

[env]
platform = espressif32@7.1.2
board = polverine
framework = arduino
monitor_speed = 115200
; Match BlackIoT Polverine reference firmware: bme690_iaq_33v_3s_4d.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBSEC3_SUPPLY_MV=3300
    -DBSEC3_SAMPLE_PERIOD_S=3
    -DBSEC3_HISTORY_DAYS=4
; Published Arduino releases, without Bosch binaries. BME690 uses the same v0.0.1
; tag required by BSEC3's package metadata, avoiding duplicate PIO installs.
lib_deps =
    bblanchon/ArduinoJson@7.0.4
    https://github.com/mauringo/BME690-Arduino-lib-unofficial.git#v0.0.1
    Bsec3-ArduinoLibrary-Unofficial=https://downloads.arduino.cc/libraries/github.com/mauringo/Bsec3_ArduinoLibrary_Unofficial-0.0.1.zip

[env:polverine-full]
lib_deps =
    ${env.lib_deps}
    https://downloads.arduino.cc/libraries/github.com/7semi-solutions/7Semi_BMV080-1.0.0.zip
build_flags = ${env.build_flags} -DUSE_BMV080
extra_scripts = pre:scripts/bmv080_build.py

[env:polverine-bsec3]
; Uses only the BME690/BSEC3 packages above.


[env:polverine-debug]
extends = env:polverine-full
build_type = debug
debug_tool = esp-builtin
debug_init_break = tbreak setup

[env:polverine-dev]
; Opt in to maintaining the actual nested library sources. No patches/copies.
extends = env:polverine-full
lib_deps = bblanchon/ArduinoJson@7.0.4
lib_extra_dirs = lib
